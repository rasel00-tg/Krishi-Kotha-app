<!DOCTYPE html>
<html lang="bn">

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="কৃষি কথা – Krishi Kotha Admin Control Panel">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="কৃষি কথা এডমিন">
  <title>কৃষি কথা – এডমিন কন্ট্রোল</title>
  <!-- Distinctive Admin Favicon (Vector SVG + High-Res PNG) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      background-color: #F8FAF7;
      font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #2E7D32;
    }

    .spinner {
      border: 4px solid rgba(46, 125, 50, 0.15);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: #2E7D32;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="spinner"></div>
    <div style="font-size: 18px; font-weight: 600;">কৃষি কথা এডমিন ড্যাশবোর্ড লোড হচ্ছে...</div>
  </div>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function (ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{ flutter_service_worker_version }},
        },
      onEntrypointLoaded: function (engineInitializer) {
        engineInitializer.initializeEngine().then(function (appRunner) {
          var loader = document.getElementById('loading');
          if (loader) loader.remove();
          appRunner.runApp();
        });
      }
      });
    });
  </script>
</body>

</html>
